# Nginx Configuration for ECDAT Production Deployment
# Domain placeholder: ecdat.example.com
# Replace ecdat.example.com with your actual domain name.

server {
    listen 80;
    listen [::]:80;
    server_name ecdat.example.com;

    # Serve built React SPA static files directly
    root /opt/ecdat/apps/web/dist;
    index index.html;

    # Body size limit matching API upload budget (32 MB)
    client_max_body_size 32M;

    # Proxy API requests to loopback FastAPI service
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve cookies
        proxy_pass_header Set-Cookie;

        # Timeouts for longer scan and AI inference jobs
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Deny access to hidden dotfiles
    location ~ /\. {
        deny all;
    }
}

