services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecdat
      POSTGRES_USER: ecdat
      POSTGRES_PASSWORD: ${ECDAT_POSTGRES_PASSWORD:?Set a local database password in .env}
    ports:
      - "127.0.0.1:5433:5432"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    mem_limit: 384m
    volumes:
      - ecdat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat -d ecdat"]
      interval: 5s
      retries: 12
volumes:
  ecdat-db:
